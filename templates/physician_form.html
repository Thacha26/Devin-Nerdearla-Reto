{% extends "base.html" %}
{% block content %}
<h1>Registrar médica/o</h1>
{% if errors %}
  <div class="flash error" role="alert">
    {% for e in errors %}<div>{{ e }}</div>{% endfor %}
  </div>
{% endif %}
<form method="post" class="card narrow">
  <label>Nombre completo * <input name="full_name" value="{{ form.full_name }}" required></label>
  <label>Usuario * <input name="username" value="{{ form.username }}" autocomplete="off" required>
    <span class="help">Letras, números, punto o guion bajo. Ej.: dra.lopez</span></label>
  <label>Contraseña * <input name="password" type="password" minlength="{{ min_length }}" autocomplete="new-password" required>
    <span class="help">Al menos {{ min_length }} caracteres.</span></label>
  <label>Repetir contraseña * <input name="password_confirm" type="password" autocomplete="new-password" required></label>
  <button type="submit">Crear cuenta</button>
  <a href="{{ url_for('physicians') }}">Cancelar</a>
</form>
{% endblock %}
